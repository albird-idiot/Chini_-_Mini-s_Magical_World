<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Pixel Runner - Chini & Mini's Magical World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pixel_runner.css">
</head>
<body>
  <!-- Return to Explore World Navigation Bar -->
  <header class="game-nav-header">
    <a href="/#explore" class="nav-pill-btn" title="Return to Chini & Mini's Magical World">
      <span>←</span> Back to Explore World
    </a>
    <div class="nav-actions-right">
      <button id="sound-toggle-btn" class="nav-pill-btn" type="button" aria-label="Toggle Sound Effects">
        🔊 Sound On
      </button>
    </div>
  </header>

  <!-- Main Game Stage -->
  <main class="game-wrapper">
    <!-- Game Title -->
    <div class="game-title-group">
      <h1 class="game-title">
        <span>Pixel Runner</span>
        <span aria-hidden="true">🏃‍♂️✨</span>
      </h1>
      <p class="game-subtitle">Jump over snails and dodge flies in this retro pixel adventure!</p>
    </div>

    <!-- Scoreboard -->
    <div class="scoreboard-container" role="region" aria-label="Game Scores">
      <div class="score-card">
        <span class="score-label">⏱️ Seconds Survived</span>
        <div id="current-score" class="score-value">0</div>
      </div>
      <div class="score-card best-card">
        <span class="score-label">⭐ Best Record</span>
        <div id="best-score" class="score-value">0</div>
      </div>
    </div>

    <!-- Responsive Game Canvas with 2:1 Aspect Ratio -->
    <div class="canvas-wrapper">
      <canvas id="pixel-canvas" width="800" height="400" aria-label="Pixel Runner Game Canvas"></canvas>
    </div>

    <!-- Mobile Quick Jump Button -->
    <div class="mobile-controls-bar">
      <button id="mobile-jump-btn" class="mobile-jump-btn" type="button" aria-label="Jump">
        <span>▲ TAP TO JUMP ▲</span>
      </button>
    </div>

    <!-- Instructions Box -->
    <aside class="instructions-box" aria-label="Game Instructions">
      <strong>How to Play:</strong> Press <strong>Space</strong>, <strong>Up Arrow</strong>, or <strong>W</strong> to Jump over snails and dodge flying pests. On phones & tablets, tap the screen or the JUMP button!
    </aside>
  </main>

  <script src="pixel_runner.js"></script>
</body>
</html>
