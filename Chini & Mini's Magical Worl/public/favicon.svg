<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Wonderland Sky Gradient Backdrop -->
    <radialGradient id="skyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </radialGradient>

    <!-- Golden Sparkle Gradient -->
    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Subtle Golden Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Wonderland Rounded Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#skyGrad)" stroke="url(#rimGrad)" stroke-width="2.5" />

  <!-- Magical Rainbow Arcs -->
  <!-- Red / Coral -->
  <path d="M 12 40 A 20 20 0 0 1 52 40" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" />
  <!-- Warm Gold -->
  <path d="M 15.5 40 A 16.5 16.5 0 0 1 48.5 40" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" />
  <!-- Emerald Green -->
  <path d="M 19 40 A 13 13 0 0 1 45 40" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" />
  <!-- Bright Sky Cyan -->
  <path d="M 22.5 40 A 9.5 9.5 0 0 1 41.5 40" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />

  <!-- Floating Fairy Sparkles -->
  <path d="M 20 16 Q 20 20 16 20 Q 20 20 20 24 Q 20 20 24 20 Q 20 20 20 16 Z" fill="#fef08a" />
  <path d="M 46 14 Q 46 17 43 17 Q 46 17 46 20 Q 46 17 49 17 Q 46 17 46 14 Z" fill="#fef08a" />
  <circle cx="13" cy="28" r="1.5" fill="#fef08a" />
  <circle cx="51" cy="27" r="1.5" fill="#fef08a" />

  <!-- Fluffy Cloud Left -->
  <g fill="url(#cloudGrad)">
    <circle cx="16" cy="42" r="7" />
    <circle cx="22" cy="39" r="6" />
    <circle cx="26" cy="43" r="5" />
    <rect x="11" y="42" width="16" height="6" rx="3" />
  </g>

  <!-- Fluffy Cloud Right -->
  <g fill="url(#cloudGrad)">
    <circle cx="48" cy="42" r="7" />
    <circle cx="42" cy="39" r="6" />
    <circle cx="38" cy="43" r="5" />
    <rect x="37" y="42" width="16" height="6" rx="3" />
  </g>

  <!-- Center Golden Wonder Star -->
  <path d="M 32 23 L 34.5 30.5 L 42 31 L 36 36 L 38 43.5 L 32 39.5 L 26 43.5 L 28 36 L 22 31 L 29.5 30.5 Z"
        fill="url(#goldStar)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Star Core Highlight -->
  <circle cx="32" cy="34" r="2" fill="#ffffff" />
</svg>
